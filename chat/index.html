<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lev.net - Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/chat.css">
    <link rel="icon" type="image/png" href="/logo.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LevNet">
    <link rel="apple-touch-icon" href="/logo.png">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
</head>
<body>

<div id="siteAuthOverlay" class="overlay">
    <h3>Password</h3>
    <input type="password" id="sitePassInput" placeholder="site password" class="card">
    <button id="siteAuthBtn" class="card">Open</button>
</div>

<div id="userAuthOverlay" class="overlay" style="display: none;">
    <h3>Login / Registration</h3>
    <p style="font-size: 0.8rem;">You can't change your username later</p>
    <input type="text" id="loginUser" placeholder="Username" class="card">
    <input type="password" id="loginPass" placeholder="Personal password" class="card">
    <button id="userAuthBtn" class="card">Login</button>
</div>

<div class="wrapper" id="chatApp" style="display: flex;">
    <div class="Header">
        <button id="menuToggle" class="card"><i class="fa-solid fa-bars"></i></button>
        <h1>Chat<br><span id="chatTitle">chat</span></h1>
        <button id="themeToggle" class="card">
            <i class="fa-solid fa-moon"></i>
        </button>
        <button id="logoutBtn" class="card"><i class="fa-solid fa-right-from-bracket"></i></button>
    </div>

    <div class="chat-container">
        <div id="sidebar">
            <div class="sidebar-content">
                <input type="text" id="chatSearch" placeholder="@user or #group" class="card">
                <div id="searchSuggestions" class="card" style="display:none; position:absolute; width:210px; z-index:100; max-height:200px; overflow-y:auto; margin-top:-5px;"></div>
                <button id="createGroupBtn" class="card" style="color: var(--text);">+ Group +</button>
                <div id="activeChatsList">
                </div>
            </div>
        </div>

        <div id="mainChat">
            <div id="chatBox"></div>
            <div class="input-row" style="position: relative;"> <div id="cmdSuggestions" class="card" style="display:none; position:absolute; bottom:100%; left:60px; width:calc(100% - 120px); z-index:1000; margin-bottom:10px;"></div>

                <label for="imgInput" class="card" style="cursor:pointer; display:flex; align-items:center; justify-content:center; width:50px;">
                    <i class="fa-regular fa-image"></i>
                    <input type="file" id="imgInput" accept="image/*" style="display:none;">
                </label>

                <textarea id="msgInput" placeholder="Message..." class="card" rows="1" style="resize:none; transition: height 0.2s;"></textarea>

                <button id="sendBtn" class="card"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</div>

<script type="module" src="../js/chat.js"></script>
<div id="msgMenu" class="card" style="display:none; position:fixed; z-index:10000; width:150px; padding:5px; flex-direction:column; gap:5px;">
    <button onclick="copyMsg()" class="card" style="font-size:0.8rem; text-align:left;"><i class="fa-regular fa-copy"></i> Copy</button>
    <button id="editBtn" class="card" style="font-size:0.8rem; text-align:left;"><i class="fa-regular fa-pen-to-square"></i> Edit</button>
    <button id="delBtn" class="card" style="font-size:0.8rem; text-align:left; color:red;"><i class="fa-regular fa-trash-can"></i> Delete</button>
</div>
<div id="customModal" class="overlay" style="display: none; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
    <div class="card" style="width: 300px; display: flex; flex-direction: column; gap: 15px; background: var(--surface);">
        <h3 id="modalTitle" style="font-size: 1rem;">Action</h3>
        <input type="text" id="modalInput" class="card" style="display: none; width: 100%;">
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
            <button id="modalCancel" class="card" style="padding: 5px 15px;">Cancel</button>
            <button id="modalConfirm" class="card" style="padding: 5px 15px; background: var(--link); color: white;">OK</button>
        </div>
    </div>
</div>
<div id="reactionPicker" class="reaction-picker">
    <span class="reaction-item" onclick="setReaction('👍')">👍</span>
    <span class="reaction-item" onclick="setReaction('👎')">👎</span>
    <span class="reaction-item" onclick="setReaction('😂')">😂</span>
    <span class="reaction-item" onclick="setReaction('😢')">😢</span>
    <span class="reaction-item" onclick="setReaction('😮')">😮</span>
    <span class="reaction-item" onclick="setReaction('🔥')">🔥</span>
    <span class="reaction-item" onclick="setReaction('🎉')">🎉</span>
</div>
</body>
</html>
