<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lev.net - Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/chat.css">
    <link rel="icon" type="image/png" href="/logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LevNet">
    <link rel="apple-touch-icon" href="/logo.png">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.json">

</head>
<body>

<div id="siteAuthOverlay" class="overlay">
    <h3>Password</h3>
    <input type="password" id="sitePassInput" placeholder="site password" class="card">
    <button id="siteAuthBtn" class="card">Open</button>
</div>

<div id="userAuthOverlay" class="overlay" style="display: none;">
    <h3>Login / Registration</h3>
    <p style="font-size: 0.8rem;">You can't change your username later</p>
    <input type="text" id="loginUser" placeholder="Username" class="card">
    <input type="password" id="loginPass" placeholder="Personal password" class="card">
    <button id="userAuthBtn" class="card">Login</button>
</div>

<div class="wrapper" id="chatApp" style="display: flex;">
    <div class="Header">
        <button id="menuToggle" class="card"><i class="fa-solid fa-bars"></i></button>
        <h1>Chat / <span id="chatTitle">chat</span></h1>
    </div>

    <div class="chat-container">
        <div id="sidebar">
            <div class="sidebar-content">
                <input type="text" id="chatSearch" placeholder="@user or #group" class="card">
                <button id="createGroupBtn" class="card">+ Group +</button>
                <div id="activeChatsList">
                    <p style="font-size:0.7rem; margin-bottom:0.5rem;">Chats: </p>
                </div>
            </div>
        </div>

        <div id="mainChat">
            <div id="chatBox"></div>
            <div class="input-row">
                <input type="text" id="msgInput" placeholder="Message..." class="card">
                <button id="sendBtn" class="card"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>
</div>

<script src="../js/firebaseconf.js"></script>
<script type="module" src="../js/chat.js"></script>
</body>
</html>
