<!doctype html>
<html>
<head>
    <title>Encrypt/Decrypt Tool</title>
    <link rel="stylesheet" href="/ideas/edtool/style.css">
</head>
<body>
<div id="passwordPrompt">
    <h2>Passwort eingeben</h2>
    <input type="password" id="passwordInput" placeholder="Passwort">
    <button id="passwordSubmit">Login</button>
    <p id="passwordError" class="error-message"></p>
</div>

<div id="mainContent" style="display: none;">
    <h1>Textkonvertierer</h1>
    <div>
        <textarea id="inputText" rows="5" cols="50" placeholder="Enter text here..."></textarea>
    </div>
    <div>
        <button id="encryptButton">Entschlüsseln</button>
        <button id="decryptButton">Verschlüsseln</button>
    </div>
    <div>
        <h2>Ergebnis:</h2>
        <textarea id="outputText" rows="5" cols="50" readonly></textarea>
    </div>
    <h4>
        Unterstützte iOS-Tastaturen:
        <ul>
            <li>Deutsch</li>
            <li>Griechisch</li>
            <li>Ukrainisch</li>
            <li>Georgisch</li>
            <li>Armenisch</li>
            <li>Hindi</li>
        </ul>
    </h4>
</div>
<script src="/ideas/edtool/script.js"></script>
</body>
</html>
