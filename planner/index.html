<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lev.net Planner</title>
    <link href="../css/planner.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/png" href="../logo.png">
</head>
<body>

<div class="planner-container">
    <!-- Top: 7 Days -->
    <div class="days-header">
        <button class="day-btn" data-day="Mo">Mo</button>
        <button class="day-btn" data-day="Tu">Tu</button>
        <button class="day-btn" data-day="We">We</button>
        <button class="day-btn" data-day="Th">Th</button>
        <button class="day-btn" data-day="Fr">Fr</button>
        <button class="day-btn" data-day="Sa">Sa</button>
        <button class="day-btn" data-day="Su">Su</button>
    </div>

    <!-- Bottom: Timeline + Content -->
    <div class="planner-body">
        <div class="timeline-column" id="timeline">
            <!-- Time slots generated by JS -->
        </div>
        <div class="tasks-column" id="tasks-grid">
            <!-- Tasks area -->
        </div>
    </div>

    <!-- Floating Action Button -->
    <button class="fab-add" id="fab-add">
        <i class="fa-solid fa-plus"></i>
    </button>
</div>

<!-- Add Task Modal -->
<div class="modal-overlay" id="task-modal">
    <div class="modal-content">
        <h2>New Task</h2>
        <div class="form-group">
            <label>Title</label>
            <input type="text" id="input-title" placeholder="What needs to be done?">
        </div>
        <div class="form-group">
            <label>Start Time (HH:MM)</label>
            <input type="text" id="input-start" placeholder="09:00" maxlength="5">
        </div>
        <div class="form-group">
            <label>End Time (HH:MM)</label>
            <input type="text" id="input-end" placeholder="10:00" maxlength="5">
        </div>

        <div class="form-row">
            <div class="form-group half">
                <label>Color</label>
                <div class="color-options" id="color-options">
                    <!-- JS will fill this -->
                </div>
                <input type="hidden" id="input-color" value="#65d8e8">
            </div>
            <div class="form-group half">
                <label>Icon</label>
                <div class="icon-select" id="icon-select-btn">
                    <i class="fa-solid fa-briefcase" id="selected-icon-display"></i>
                </div>
                <input type="hidden" id="input-icon" value="fa-briefcase">
                <!-- Simple icon dropdown content could go here, or handle via JS overlay -->
                <div class="icon-dropdown hidden" id="icon-dropdown">
                    <!-- JS fills -->
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>Repeat</label>
            <select id="input-repeat">
                <option value="none">No Repeat</option>
                <option value="daily">Daily</option>
            </select>
        </div>

        <div class="modal-actions">
            <button class="btn btn-delete hidden" id="btn-delete">Delete</button>
            <div style="flex:1"></div>
            <button class="btn btn-cancel" id="btn-cancel">Cancel</button>
            <button class="btn btn-save" id="btn-save">Save</button>
        </div>
    </div>
</div>

<script src="../js/planner.js"></script>
</body>
</html>
